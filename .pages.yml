media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: Blog-Beiträge
    type: collection
    path: _posts
    view:
      fields: [title, date]
    fields:
      - name: layout
        label: Layout
        type: string
        hidden: true
        default: post
      - name: title
        label: Überschrift
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
      - name: image
        label: Titelbild (optional)
        type: image
      - name: body
        label: Beitragstext
        type: rich-text
