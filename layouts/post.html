---
layout: default
---
<article class="card">
  <div class="post-meta">{{ page.date | date: "%d.%m.%Y" }}</div>
  <h2>{{ page.title }}</h2>
  {% if page.image %}
    <img class="post-cover" src="{{ page.image | relative_url }}" alt="{{ page.title }}" />
  {% endif %}
  {{ content }}
</article>

<div style="text-align: center;">
  <a class="btn btn-secondary" href="{{ '/' | relative_url }}">← Zurück zur Übersicht</a>
</div>
